<div class="management-page">
  <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 0.85rem;">
      <button class="back-icon-btn" (click)="goBackToDashboard()" title="Back to Admin Dashboard" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; background: #ffffff; border: 1px solid #cbd5e1; color: #475569; cursor: pointer;">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <h1 style="margin: 0; font-size: 1.75rem;">Recordings & Reports</h1>
        <p class="subtitle" style="margin: 0;">View and audit all consultation recordings and clinical reports</p>
      </div>
    </div>
    <button class="btn btn-outline" (click)="goBackToDashboard()" style="padding: 0.55rem 1.15rem; background: #ffffff; border: 1px solid #cbd5e1; color: #475569; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem;">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Dashboard</span>
    </button>
  </div>

  <div class="card table-card">
    <div class="tab-header">
      <div class="tabs">
        <button class="tab-btn" [class.active]="activeTab === 'Recordings'" (click)="activeTab = 'Recordings'">Recordings</button>
        <button class="tab-btn" [class.active]="activeTab === 'Reports'" (click)="activeTab = 'Reports'">Reports</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" [(ngModel)]="searchTerm" placeholder="Search recordings...">
      </div>

      <div class="filters">
        <select>
          <option>All Doctors</option>
          <option>Dr. Rahul Sharma</option>
          <option>Dr. Neha Verma</option>
        </select>

        <select>
          <option>This Month</option>
          <option>Last Month</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Duration</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rec of filteredRecordings">
            <td class="font-bold">{{ rec.patientName }}</td>
            <td>{{ rec.doctorName }}</td>
            <td class="text-muted">{{ rec.date }}</td>
            <td>{{ rec.duration }}</td>
            <td>
              <span class="badge" [class.badge-processed]="rec.status === 'Processed'" [class.badge-processing]="rec.status === 'Processing'">
                <span class="badge-dot"></span> {{ rec.status }}
              </span>
            </td>
            <td>
              <button class="action-icon-btn" title="View Recording Details"><i class="fa-regular fa-eye"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="table-footer">
      <span>Showing 1 to {{ filteredRecordings.length }} of 2,356 recordings</span>
      <div class="pagination">
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <span>... 235</span>
      </div>
    </div>
  </div>
</div>
