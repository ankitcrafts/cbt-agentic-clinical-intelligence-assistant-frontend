<div class="login-wrapper">
  <div class="login-card card">
    <div class="auth-tabs">
      <button type="button" class="tab-btn" [class.active]="isLoginMode" (click)="isLoginMode = true">Sign In</button>
      <button type="button" class="tab-btn" [class.active]="!isLoginMode" (click)="isLoginMode = false">Create Account</button>
    </div>

    <div class="login-header">
      <div class="icon-circle admin-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h2>{{ isLoginMode ? 'System Administrator Portal' : 'Register Administrator Account' }}</h2>
      <p class="subtitle">{{ isLoginMode ? 'Access enterprise hospital administration controls' : 'Create a new administrator credential profile' }}</p>
      <div class="designation-pill admin-badge">
        <i class="fa-solid fa-id-badge"></i> Designation: System Administrator
      </div>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group" *ngIf="!isLoginMode">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="fullName" name="fullName" required placeholder="Ankit Sharma">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="admin@hospital.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required>
        <a href="javascript:void(0)" class="forgot-link" *ngIf="isLoginMode">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-success btn-full">
        {{ isLoginMode ? 'Sign In as System Administrator' : 'Complete Administrator Signup' }} <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="login-footer">
      <span><i class="fa-solid fa-shield-halved"></i> HIPAA Compliant Enterprise Portal</span>
    </div>
  </div>
</div>
