<div class="login-wrapper">
  <div class="login-card card">
    <div class="auth-tabs">
      <button type="button" class="tab-btn" [class.active]="isLoginMode" (click)="isLoginMode = true">Sign In</button>
      <button type="button" class="tab-btn" [class.active]="!isLoginMode" (click)="isLoginMode = false">Create Account</button>
    </div>

    <div class="login-header">
      <div class="icon-circle patient-icon"><i class="fa-solid fa-heart-pulse"></i></div>
      <h2>{{ isLoginMode ? 'Patient Health Portal' : 'Register New Patient Profile' }}</h2>
      <p class="subtitle">{{ isLoginMode ? 'View your personal consultation records, transcripts & prescriptions' : 'Create your secure health access account' }}</p>
      <div class="designation-pill patient-badge">
        <i class="fa-solid fa-hospital-user"></i> Designation: Patient (ID: {{ patientId }})
      </div>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group" *ngIf="!isLoginMode">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="fullName" name="fullName" required placeholder="Priya Verma">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="patient@email.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required>
        <a href="javascript:void(0)" class="forgot-link" *ngIf="isLoginMode">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-purple btn-full">
        {{ isLoginMode ? 'Sign In to Health Portal' : 'Register Patient Account' }} <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="login-footer">
      <span><i class="fa-solid fa-shield-halved"></i> Encrypted Patient Portal</span>
    </div>
  </div>
</div>
