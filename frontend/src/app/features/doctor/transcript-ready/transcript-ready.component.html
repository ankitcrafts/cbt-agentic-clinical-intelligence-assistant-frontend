<div class="transcript-page">
  <div class="card transcript-card">
    <div class="card-header">
      <div class="tabs">
        <button class="tab-btn" [class.active]="activeTab === 'Transcript'" (click)="activeTab = 'Transcript'">Transcript</button>
        <button class="tab-btn" [class.active]="activeTab === 'Details'" (click)="activeTab = 'Details'">Details</button>
      </div>

      <div class="action-buttons">
        <button class="btn btn-outline btn-sm">
          <i class="fa-solid fa-download"></i> Download
        </button>
        <button class="btn btn-primary btn-sm" (click)="generateSoap()">
          Generate SOAP Note <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- Transcript Body -->
    <div class="transcript-body" *ngIf="activeTab === 'Transcript'">
      <div class="dialogue-turn" *ngFor="let turn of consultation.transcript">
        <span class="speaker" [class.doctor-speaker]="turn.speaker === 'Doctor'" [class.patient-speaker]="turn.speaker === 'Patient'">
          {{ turn.speaker }}:
        </span>
        <span class="text">{{ turn.text }}</span>
      </div>
    </div>

    <!-- Details Body -->
    <div class="details-body" *ngIf="activeTab === 'Details'">
      <div class="info-row"><strong>Patient:</strong> {{ consultation.patientName }} ({{ consultation.patientPid }})</div>
      <div class="info-row"><strong>Doctor:</strong> {{ consultation.doctorName }}</div>
      <div class="info-row"><strong>Date:</strong> {{ consultation.date }}</div>
      <div class="info-row"><strong>Duration:</strong> {{ consultation.duration }}</div>
    </div>

    <div class="card-footer">
      <span>Words: <strong>{{ consultation.wordCount }}</strong></span>
      <span>Duration: <strong>{{ consultation.duration }}</strong></span>
    </div>
  </div>
</div>
